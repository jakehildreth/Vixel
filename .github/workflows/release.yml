name: Release

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compute CalVer version
        run: |
          # yyyy.M.dHHmm for the package (e.g. 2026.9.230900)
          VERSION=$(date -u +'%-Y.%-m.%-d%H%M')
          # AssemblyVersion rejects 0-prefixed segments AND values > 65534; split dHHmm into d.HHmm
          ASM=$(echo "$VERSION" | awk -F. '{ sub(/^0+/,"",$2); d=substr($3,1,length($3)-4); h=substr($3,length($3)-3); sub(/^0+/,"",h); print $1"."$2"."d"."h }')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asm=$ASM" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (assembly $ASM)"

      - name: Pack dotnet tool
        run: dotnet pack src/Vixel --configuration Release -o artifacts /p:Version=${{ steps.version.outputs.version }} /p:AssemblyVersion=${{ steps.version.outputs.asm }}

      - name: Publish self-contained binaries
        run: |
          for RID in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/Vixel --configuration Release -r $RID \
              --self-contained true -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none -p:DebugSymbols=false \
              -o "publish/$RID" \
              /p:Version=${{ steps.version.outputs.version }} /p:AssemblyVersion=${{ steps.version.outputs.asm }}
            (cd "publish/$RID" && zip -qr "../../artifacts/vixel-${{ steps.version.outputs.version }}-$RID.zip" .)
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg

      # NuGet push is a manual step after the draft release is reviewed:
      #   dotnet nuget push artifacts/Vixel.<version>.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json
